<div>
  <h1 class="text-3xl font-bold text-gray-800 mb-6">Dashboard</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (stat of stats; track stat.label) {
      <div class="bg-white rounded-lg shadow-md p-6 flex items-center gap-4">
        <div [class]="stat.color + ' text-white text-4xl p-4 rounded-lg'">
          {{ stat.icon }}
        </div>
        <div>
          <p class="text-gray-500 text-sm">{{ stat.label }}</p>
          <p class="text-2xl font-bold text-gray-800">{{ stat.value }}</p>
        </div>
      </div>
    }
  </div>

  <div class="mt-8 bg-white rounded-lg shadow-md p-6">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Bem-vindo ao Painel Administrativo</h2>
    <p class="text-gray-600">
      Aqui você pode gerenciar todos os aspectos da sua loja. Use o menu lateral para navegar entre as diferentes seções.
    </p>
  </div>
</div>
