<section class="mb-12">
  <h2 class="mb-5 border-b border-[color:var(--hc-border)] pb-2 text-2xl font-bold text-[color:var(--hc-ink)] md:text-3xl">
    {{ title }}
  </h2>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
    @for (product of products; track product.id) {
      <app-product-card [product]="product" (add)="onAddProduct($event)"></app-product-card>
    }
    @empty {
      <p class="col-span-full rounded-xl border border-dashed border-[color:var(--hc-border)] py-8 text-center text-sm text-[color:var(--hc-muted)]">
        Nenhum produto disponivel nesta categoria.
      </p>
    }
  </div>
</section>
