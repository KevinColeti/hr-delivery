<section class="mb-12">
  <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-6 border-b-2 border-gray-200 pb-2">
    {{ title }}
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (product of products; track product.id) {
      <app-product-card [product]="product"></app-product-card>
    }
    @empty {
      <p class="text-gray-500 text-center py-8 col-span-full">Nenhum produto disponível nesta categoria.</p>
    }
  </div>
</section>
