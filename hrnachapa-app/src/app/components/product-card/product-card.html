<div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 p-4">
  <div class="flex gap-4">
    <div class="flex-shrink-0">
      <img
        [src]="product.image"
        [alt]="product.name"
        class="w-24 h-24 object-cover rounded-lg">
    </div>

    <div class="flex-1 flex flex-col">
      <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ product.name }}</h3>
      <p class="text-sm text-gray-600 mb-2 line-clamp-2">{{ product.description }}</p>

      <div class="mt-auto flex items-center justify-between">
        <span class="text-xl font-bold text-green-600">
          {{ product.price | currency:'BRL':'symbol':'1.2-2' }}
        </span>
        <button
          class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          Adicionar
        </button>
      </div>
    </div>
  </div>
</div>
