<div class="rounded-2xl border border-[color:var(--hc-border)] bg-[color:var(--hc-paper)] p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
  <div class="flex gap-4">
    <img [src]="product.image" [alt]="product.name" class="h-24 w-24 rounded-xl object-cover" />

    <div class="flex flex-1 flex-col">
      <h3 class="mb-1 text-lg font-bold text-[color:var(--hc-ink)]">{{ product.name }}</h3>
      <p class="mb-2 line-clamp-2 text-sm text-[color:var(--hc-muted)]">{{ product.description }}</p>

      <div class="mt-auto flex items-center justify-between">
        <span class="text-xl font-bold text-[color:var(--hc-accent)]">
          {{ product.price | currency:'BRL':'symbol':'1.2-2' }}
        </span>
        <button class="rounded-full bg-[color:var(--hc-accent)] px-4 py-2 text-xs font-semibold uppercase tracking-[0.1em] text-amber-50 hover:bg-[color:var(--hc-accent-dark)]">
          Adicionar
        </button>
      </div>
    </div>
  </div>
</div>
